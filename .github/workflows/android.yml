name: Build NuvioMobile APK

on:
  push:
    branches: [cmp-rewrite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create local.properties (self-hosted backend)
        run: |
          cat > local.properties <<'PROPS'
          NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0
          NUVIO_SUPABASE_FALLBACK_URL=
          TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76
          NUVIO_ANDROID_DISTRIBUTION=full
          PROPS
          sed -i 's/^          //' local.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-apk
          path: androidApp/build/outputs/apk/full/*/*.apk
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: NuvioMobile build ${{ github.run_number }}
          prerelease: true
          files: androidApp/build/outputs/apk/full/*/*.apk

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-debug-logs
          name: Mobile CI debug logs
          prerelease: true
          files: build-log.txt
