name: Build NuvioMobile (upstream release sync)

on:
  push:
    branches: [cmp-rewrite]
    paths: ['.github/**']
  workflow_dispatch:
    # Builds are triggered by the local watcher on vgupta1192's box
    # (~/bin/nuvio-sync-check.sh): GitHub's schedule event drops runs for
    # hours, so the old hourly cron never fired reliably. The watcher pushes
    # a sync-pulse commit when upstream has an unbuilt release, which lands
    # here via the push trigger above.

permissions:
  contents: write

# one Mobile build at a time; a newer push waits instead of racing the release upload
concurrency:
  group: build-nuviomobile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          REL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/NuvioMedia/NuvioMobile/releases/latest)
          UP=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          # attach the upstream release notes so fork releases carry the upstream changelog
          {
            echo 'notes<<GHR_NOTES_EOF_9d41f'
            printf 'Fork CI build of upstream %s.\n\n' "$UP"
            printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('body') or '(no upstream release notes)')"
            echo 'GHR_NOTES_EOF_9d41f'
          } >> "$GITHUB_OUTPUT"
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioMobile/releases/tags/mobile-$UP")
          # workflow_dispatch or a head commit message containing [force-build] rebuilds
          # even when the release already exists
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioMobile/releases/tags/mobile-$UP" | jq --arg want "NuvioMobile-${VER}-b" '[.assets[] | select(.name | startswith($want))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "already built with release naming, skipping"; SHOULD=false; else echo "release exists but assets need renaming, rebuilding"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioMobile
          ref: cmp-rewrite

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Hide Trakt card (Simkl-only build)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          curl -sSL https://raw.githubusercontent.com/vgupta1192/NuvioMobile/cmp-rewrite/.github/patches/hide-unconfigured-trakt.patch -o /tmp/trakt.patch
          git apply --3way /tmp/trakt.patch

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: .github/patches

      # Self-host fork patch: the in-app updater checks this fork's releases and compares the CI
      # run number (versionName <ver>-fork.<run>, asset NuvioMobile-<ver>-b<run>.apk).
      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          P=fork-src/.github/patches/fork-updater.patch
          # plain git apply is all-or-nothing, so a failure leaves the tree (and the Trakt patch) as is
          if git apply "$P"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          else
            echo "::warning::fork-updater.patch no longer applies to upstream; building without it"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # Same signing key for every build, so an update installs over the existing app. Gradle signs
      # debug builds with ~/.android/debug.keystore (alias androiddebugkey, password android); without
      # this secret each runner makes a random one and every update needs an uninstall first.
      - name: Fixed signing key
        id: signkey
        if: steps.ver.outputs.should_build == 'true'
        env:
          KS_B64: ${{ secrets.MOBILE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            # An explicit init script, not ~/.android/debug.keystore: AGP looks for the default debug
            # key under ANDROID_USER_HOME when the runner sets it, so the file alone was ignored (b50).
            mkdir -p "$RUNNER_TEMP/nuvio-signing"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nuvio-signing/fixed.keystore"
            cat > "$RUNNER_TEMP/nuvio-signing/fixed-signing.gradle" <<GRADLE
          allprojects { p ->
            p.plugins.withId('com.android.application') {
              p.android.signingConfigs.debug.storeFile = new File('$RUNNER_TEMP/nuvio-signing/fixed.keystore')
              p.android.signingConfigs.debug.storePassword = 'android'
              p.android.signingConfigs.debug.keyAlias = 'androiddebugkey'
              p.android.signingConfigs.debug.keyPassword = 'android'
            }
          }
          GRADLE
            echo "init=--init-script=$RUNNER_TEMP/nuvio-signing/fixed-signing.gradle" >> "$GITHUB_OUTPUT"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::secret MOBILE_DEBUG_KEYSTORE_B64 not set; APK gets a random signing key"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'nuvio.app.versionName=${{ steps.ver.outputs.ver }}' \
            > local.properties

      - name: Build debug APK
        if: steps.ver.outputs.should_build == 'true'
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            echo "attempt $i"
            ./gradlew ${{ steps.signkey.outputs.init }} :androidApp:assembleFullDebug "-Pnuvio.app.versionName=${{ steps.ver.outputs.ver }}-fork.${{ github.run_number }}" --stacktrace 2>&1 | tee build-log.txt && ok=1 && break
            echo "gradle failed, retrying in 60s (transient repo errors are common)"
            sleep 60
          done
          [ "$ok" = 1 ] || { echo "gradle failed after 3 attempts (see build-log.txt above)"; exit 1; }

      # Proof, not assumption: the APK must carry the fixed key's certificate (CN=NuvioMobile self-host)
      - name: Verify signing certificate
        id: signcheck
        if: steps.ver.outputs.should_build == 'true'
        run: |
          APK=$(ls androidApp/build/outputs/apk/full/*/*.apk | head -1)
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" verify --print-certs "$APK" | tee signer.txt
          if grep -q "CN=NuvioMobile self-host" signer.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APK is not signed with the fixed key"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename artifacts
        if: steps.ver.outputs.should_build == 'true'
        run: |
          mkdir -p release-files
          cp androidApp/build/outputs/apk/full/*/*.apk "release-files/NuvioMobile-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.apk"
          ls -l release-files

      - name: Upload artifacts
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-apk
          path: release-files/*.apk
          if-no-files-found: error

      - name: Publish to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ steps.ver.outputs.tag }}
          name: NuvioMobile ${{ steps.ver.outputs.tag }}
          prerelease: true
          body: ${{ steps.ver.outputs.notes }}
          files: release-files/*.apk

      - name: Remove legacy-named assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioMobile-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.apk
          TAG: mobile-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name != $keep)
                | select((((.name | capture("-b(?<n>[0-9]+)\\.apk$") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: mobile-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
          UPD_PATCHED: ${{ steps.patch_updater.outputs.applied }}
          FIXED_KEY: ${{ steps.signcheck.outputs.ok }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          if [ "$UPD_PATCHED" = "true" ] && [ "$FIXED_KEY" = "true" ]; then
            HOW="Build ${BUILD_NO}: phones on a fork build show the update banner at app start (or Settings → check for updates) and install it in-app over the existing app"
          elif [ "$FIXED_KEY" = "true" ]; then
            HOW="⚠️ fork-updater patch did NOT apply — install the APK manually (it installs over the existing app)"
          else
            HOW="⚠️ NOT signed with the fixed key (secret MOBILE_DEBUG_KEYSTORE_B64 missing or not applied) — uninstall old app first, then install the APK"
          fi
          MSG="📱 NuvioMobile ${VER} is ready
          Upstream release: ${VER}
          ${HOW}
          Download: https://github.com/vgupta1192/NuvioMobile/releases/tag/${REL_TAG}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-debug-logs
          name: Mobile CI debug logs
          prerelease: true
          files: build-log.txt
