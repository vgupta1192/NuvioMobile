name: Build NuvioMobile Jellyfin+LiveTV (upstream release sync)
# sync-pulse: forced 2026-10-28T17:04Z

on:
  push:
    branches: [master]
    paths: ['.github/**']
  workflow_dispatch:
    # Builds are triggered by the local watcher on vgupta1192's box
    # (~/bin/nuvio-sync-check.sh nuviomobile-jellyfin-livetv): GitHub's schedule event drops runs for
    # hours, so the old hourly cron never fired reliably. The watcher pushes
    # a sync-pulse commit when upstream has an unbuilt release, which lands
    # here via the push trigger above.

# 2026-10-12: re-arm push trigger (no runs fired since 10-08)
permissions:
  contents: write

# one LiveTV build at a time; separate group so it never races the main android.yml run
concurrency:
  group: build-nuviomobile-jellyfin-livetv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Newest non-draft release, prereleases included: /releases/latest skips prereleases,
          # and NuvioTV ships its 1.1.0 betas only as prereleases (2026-10-15).
          REL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/NuvioMedia/NuvioMobile/releases?per_page=10" \
            | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin) if not x.get('draft')];r.sort(key=lambda x:x.get('published_at') or '',reverse=True);print(json.dumps(r[0]))")
          UP=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          # attach the upstream release notes so fork releases carry the upstream changelog
          {
            echo 'notes<<GHR_NOTES_EOF_9d41f'
            printf 'Fork CI build of upstream %s.\n\n' "$UP"
            printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('body') or '(no upstream release notes)')"
            echo 'GHR_NOTES_EOF_9d41f'
          } >> "$GITHUB_OUTPUT"
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioMobile/releases/tags/mobile-jellyfin-livetv-$UP")
          # workflow_dispatch or a head commit message containing [force-build] rebuilds
          # even when the release already exists
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioMobile/releases/tags/mobile-jellyfin-livetv-$UP" | jq --arg want "NuvioMobileJellyfinTV-${VER}-b" '[.assets[] | select(.name | startswith($want) and endswith(".apk"))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "already built with release naming, skipping"; SHOULD=false; else echo "release exists but assets need renaming, rebuilding"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioMobile
          ref: 86e0d5bb45f20d541d17f92146d60746420db71d # pinned: patches rebased onto this upstream commit (10-28); re-pin only after re-simulating the chain

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: |
            .github/patches
            .github/workflows

      - name: Hide Trakt card (Simkl-only build)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/hide-unconfigured-trakt.patch

      # Build optimization (optional): release builds get per-ABI split APKs; this keeps only
      # arm64-v8a (the only ABI the release publishes), halving native-lib packaging work.
      # If upstream changed the splits block, build unoptimized rather than fail.
      - name: Apply ABI build-optimization patch (optional)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if git apply fork-src/.github/patches/mobile-release-opt.patch; then
            echo "arm64-v8a-only splits"
          else
            echo "::warning::mobile-release-opt.patch no longer applies; building all ABI APKs as before"
          fi

      # Self-host fork patch: the in-app updater checks this fork's releases and compares the CI
      # run number (versionName <ver>-fork.<run>, asset NuvioMobile-<ver>-b<run>.apk).
      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          P=fork-src/.github/patches/fork-updater.patch
          # plain git apply is all-or-nothing, so a failure leaves the tree (and the Trakt patch) as is
          if git apply "$P"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          else
            echo "::warning::fork-updater.patch no longer applies to upstream; building without it"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # jellyfin-livetv variant: its updater follows only mobile-jellyfin-livetv-* releases (needs fork-updater)
      - name: Apply jellyfintv-updater patch
        if: steps.ver.outputs.should_build == 'true' && steps.patch_updater.outputs.applied == 'true'
        run: git apply fork-src/.github/patches/jellyfintv-updater.patch

      # Jellyfin variant: native Jellyfin feature + the side-install variant (see loop below);
      # required together, otherwise the APK would install over another Nuvio app.
      # (combos also apply the Live TV patches first.) autosync-feature carries the
      # NuvioMobile-Reshaped AutoSync (AutoSync V2, bubble toasts, audio sync fallback).
      - name: Apply feature and variant patches
        if: steps.ver.outputs.should_build == 'true'
        run: |
          for P in livetv-feature livetv-variant jellyfin-feature autosync-feature jellyfintv-variant; do
            if ! git apply "fork-src/.github/patches/$P.patch"; then
              echo "::error::$P.patch no longer applies to upstream cmp-rewrite"
              exit 1
            fi
          done
          git diff --stat

      # Same signing key for every build, so an update installs over the existing app. Gradle signs
      # debug builds with ~/.android/debug.keystore (alias androiddebugkey, password android); without
      # this secret each runner makes a random one and every update needs an uninstall first.
      # Optional ports from DavidVamaiotu's Nuvio*-Reshaped, one patch per feature. They are
      # warning-only: a patch that no longer applies is skipped and the build goes on without it.
      - name: Apply optional Reshaped ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-ports
          for P in autosync-libmpv-compat livetv-robustness custom-stretch jellyfin-subtitles audio-sync-hls generated-subtitles synced-subtitles seek-previews volume-boost connection-fit subtitle-fonts library-calendar; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Fork feature (applies on top of the whole chain, mandatory): Jellyfin screen rewrite —
      # cinematic home (hero pager + row per library) + full-screen detail page reusing the
      # app's DetailHero/DetailMetaInfo/DetailCastSection, with media badges and cast photos.
      - name: Apply Jellyfin cinematic UI patch
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if ! git apply fork-src/.github/patches/mobile-jellyfin-cinematic-ui.patch; then
            echo "::error::mobile-jellyfin-cinematic-ui.patch no longer applies to upstream cmp-rewrite"
            exit 1
          fi

      # Ports of features from luqmanfadlli/NuvioMobile-Enhanced and fork-original extras, one patch
      # per feature. Warning-only: a patch that no longer applies is skipped, the build goes on.
      - name: Apply Enhanced ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # enhanced-ports
          for P in enhanced-base livetv-iptv-sources livetv-guide-grid instant-home streams-pin-search episode-navigator downloads-wifi-only trackers-anilist-wetrakr private-viewing dynamic-home-background player-quality-chooser downloads-sd-card details-rate-action player-cast hero-trailer-options startup-preloader player-quick-actions user-ratings mini-player player-hls-quality-ratings details-actions-legacy-controls ports-compile-fixes downloads-settings-saf downloads-icon-tint autosync-bubble-stuck-fix autosync-bubble-cancel-fix smart-enhance player-picture-audio custom-stretch-startup-fix picture-sound-settings youtube-playback youtube-diag youtube-livetv custom-stretch-continuous custom-stretch-memory custom-stretch-steady custom-stretch-stable custom-stretch-shots autosync-second-round autosync-giveup-panel synced-own-stream-first subtitle-list-sync-again sync-again-keep-saved youtube-captions hide-sync-again-generated youtube-captions-shared-fetch youtube-captions-rate-limit youtube-captions-disk-cache youtube-captions-account-sync youtube-captions-server youtube-captions-file-sidecar youtube-captions-clean-rolling playback-network-tuning network-tuning-addons shared-http-image-cache livetv-iptv-settings netflix-style livetv-netflix-style netflix-parity mobile-dx-sound-modes mobile-dx-picture-enhance mobile-dx-remember-keys mobile-dx-second-subtitle mobile-dx-stream-stats mobile-dx-watched-titles mobile-dx-watch-stats mobile-dx-intro-sounds mobile-dx-addon-backup mobile-profile-insights mobile-dx-second-subtitle-b mobile-hero-rotation-speed mobile-dx-addon-backup-file mobile-native-thumbs mobile-cs3-runtime mobile-cs3-runtime-fix mobile-small-ports mobile-cs3-streams-fix mobile-cs3-diagnostics mobile-cs3-diagnostics-tab mobile-cs3-loader-fallback mobile-cs3-proguard mobile-cs3-group-tab mobile-nuvio-read-card mobile-cs3-home-catalogs mobile-enhanced-port mobile-publicmetadb mobile-small-ports-2 mobile-player-ports mobile-integrations-hub mobile-features-hub mobile-ne2-leftovers mobile-fixes-batch14 mobile-fixes-batch15; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      - name: Fixed signing key
        id: signkey
        if: steps.ver.outputs.should_build == 'true'
        env:
          KS_B64: ${{ secrets.MOBILE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Same keystore as every previous build, so updates still install over the existing
            # app. The RELEASE build signs through NUVIO_RELEASE_STORE_* in local.properties
            # (the release signingConfig reads those); cert is identical to the old debug builds.
            mkdir -p "$RUNNER_TEMP/nuvio-signing"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nuvio-signing/fixed.keystore"
            echo "store=$RUNNER_TEMP/nuvio-signing/fixed.keystore" >> "$GITHUB_OUTPUT"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            # No secret: build anyway with a throwaway keystore so the cert check below warns.
            mkdir -p "$RUNNER_TEMP/nuvio-signing"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nuvio-signing/fixed.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=NuvioMobile self-host" >/dev/null 2>&1
            echo "store=$RUNNER_TEMP/nuvio-signing/fixed.keystore" >> "$GITHUB_OUTPUT"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'MDBLIST_CLIENT_ID=37RRuqIIBQbBsHmxcdl3RGRMhrpTK8FdFxAGltS0' \
            'TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'nuvio.app.versionName=${{ steps.ver.outputs.ver }}' \
            > local.properties
          if [ -n "${{ steps.signkey.outputs.store }}" ]; then
            printf '%s\n' \
              "NUVIO_RELEASE_STORE_FILE=${{ steps.signkey.outputs.store }}" \
              'NUVIO_RELEASE_STORE_PASSWORD=android' \
              'NUVIO_RELEASE_KEY_ALIAS=androiddebugkey' \
              'NUVIO_RELEASE_KEY_PASSWORD=android' \
              >> local.properties
          fi

      # Native thumbnail decoder (Rust, mobile-native-thumbs.patch); skipped when that patch did not apply.
      - name: Set up Rust for native thumbnails
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if [ -d native ]; then
            rustup target add aarch64-linux-android
            cargo install cargo-ndk --locked
          fi

      - name: Thumbnail cache write key
        if: steps.ver.outputs.should_build == 'true'
        env:
          THUMBS_WRITE_TOKEN: ${{ secrets.THUMBS_WRITE_TOKEN }}
        run: |
          F=composeApp/src/androidMain/kotlin/com/nuvio/app/features/player/seekpreview/local/CloudThumbToken.kt
          if [ -n "$THUMBS_WRITE_TOKEN" ] && [ -f "$F" ]; then
            printf 'package com.nuvio.app.features.player.seekpreview.local\n\ninternal object CloudThumbToken {\n    const val VALUE = "%s"\n}\n' "$THUMBS_WRITE_TOKEN" > "$F"
          fi

      - name: Build release APK (minified, arm64 split)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            echo "attempt $i"
            ./gradlew :androidApp:assembleFullRelease "-Pnuvio.app.versionName=${{ steps.ver.outputs.ver }}-fork.${{ github.run_number }}" --stacktrace 2>&1 | tee build-log.txt && ok=1 && break
            # Compile errors don't go away on retry: show them as annotations (readable without
            # signing in) and stop.
            if grep -qE '^e: ' build-log.txt; then
              grep -E '^e: ' build-log.txt | head -30 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
              exit 1
            fi
            echo "gradle failed, retrying in 60s (transient repo errors are common)"
            sleep 60
          done
          [ "$ok" = 1 ] || { grep -E 'FAILURE|What went wrong' -A4 build-log.txt | head -20 | while IFS= read -r line; do echo "::error::${line:0:900}"; done; echo "gradle failed after 3 attempts (see build-log.txt above)"; exit 1; }

      # Proof, not assumption: the APK must carry the fixed key's certificate (CN=NuvioMobile self-host)
      - name: Verify signing certificate
        id: signcheck
        if: steps.ver.outputs.should_build == 'true'
        run: |
          APK=$(ls androidApp/build/outputs/apk/full/*/*.apk | head -1)
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" verify --print-certs "$APK" | tee signer.txt
          if grep -q "CN=NuvioMobile self-host" signer.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APK is not signed with the fixed key"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename artifacts
        if: steps.ver.outputs.should_build == 'true'
        run: |
          mkdir -p release-files
          APK=$(ls androidApp/build/outputs/apk/full/*/*arm64-v8a*release*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then APK=$(ls androidApp/build/outputs/apk/full/*/*.apk 2>/dev/null | head -1 || true); fi
          if [ -z "$APK" ]; then
            echo "::error::no APK produced"
            find androidApp/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "selected: $APK"
          cp "$APK" "release-files/NuvioMobileJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.apk"
          ls -l release-files

      - name: Upload artifacts
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobileJellyfinTV-apk
          path: release-files/*.apk
          if-no-files-found: error

      - name: Publish to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-jellyfin-livetv-${{ steps.ver.outputs.tag }}
          name: NuvioMobile Jellyfin+LiveTV ${{ steps.ver.outputs.tag }}
          prerelease: true
          body: ${{ steps.ver.outputs.notes }}
          files: release-files/*.apk

      - name: Remove legacy-named assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioMobileJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.apk
          TAG: mobile-jellyfin-livetv-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name != $keep)
                | select((((.name | capture("-b(?<n>[0-9]+)\\.apk$") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: mobile-jellyfin-livetv-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
          UPD_PATCHED: ${{ steps.patch_updater.outputs.applied }}
          FIXED_KEY: ${{ steps.signcheck.outputs.ok }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          if [ "$UPD_PATCHED" = "true" ] && [ "$FIXED_KEY" = "true" ]; then
            HOW="Build ${BUILD_NO}: phones on a fork build show the update banner at app start (or Settings → check for updates) and install it in-app over the existing app"
          elif [ "$FIXED_KEY" = "true" ]; then
            HOW="⚠️ fork-updater patch did NOT apply — install the APK manually (it installs over the existing Live TV app)"
          else
            HOW="⚠️ NOT signed with the fixed key (secret MOBILE_DEBUG_KEYSTORE_B64 missing or not applied) — uninstall old app first, then install the APK"
          fi
          HASH=""
          for f in release-files/*.apk; do
            [ -e "$f" ] || continue
            HASH="${HASH}$(basename "$f"): $(stat -c%s "$f") bytes, sha256 $(sha256sum "$f" | cut -c1-16)..."
          done
          MSG="📺📱 NuvioMobile Jellyfin+LiveTV ${VER} is ready
          Upstream release: ${VER}
          Release build (R8-minified), arm64-v8a APK. Installs alongside official Nuvio as \"Nuvio\" (own login/settings; Live TV + Jellyfin)
          ${HOW}
          ${HASH}
          Download: https://github.com/vgupta1192/NuvioMobile/releases/tag/${REL_TAG}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-jellyfin-livetv-debug-logs
          name: Mobile LiveTV CI debug logs
          prerelease: true
          files: build-log.txt

  # Unsigned iOS IPA, built the same way upstream builds its test IPAs
  # (scripts/prepare-ios-dependencies.sh + scripts/build-ios-ipa.sh, CODE_SIGNING_ALLOWED=NO).
  # Sideload with any signing tool (AltStore/Sideloadly/esign). iPad works — the app is a
  # universal iOS binary. NOTE: the Live TV + Jellyfin nav entries are Android-only right now
  # (their iOS platform actuals are compile-only stubs), so the IPA behaves like the main app.
  ios:
    if: false  # iOS build disabled for now; remove this line to re-enable
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Newest non-draft release, prereleases included: /releases/latest skips prereleases,
          # and NuvioTV ships its 1.1.0 betas only as prereleases (2026-10-15).
          REL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/NuvioMedia/NuvioMobile/releases?per_page=10" \
            | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin) if not x.get('draft')];r.sort(key=lambda x:x.get('published_at') or '',reverse=True);print(json.dumps(r[0]))")
          UP=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          {
            echo 'notes<<GHR_NOTES_EOF_9d41f'
            printf 'Fork CI build of upstream %s.\n\n' "$UP"
            printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('body') or '(no upstream release notes)')"
            echo 'GHR_NOTES_EOF_9d41f'
          } >> "$GITHUB_OUTPUT"
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioMobile/releases/tags/mobile-jellyfin-livetv-$UP")
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioMobile/releases/tags/mobile-jellyfin-livetv-$UP" | jq --arg want "NuvioMobileJellyfinTV-${VER}-b" '[.assets[] | select(.name | startswith($want) and endswith(".ipa"))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "IPA already built, skipping"; SHOULD=false; else echo "release exists but IPA missing, building"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioMobile
          ref: 86e0d5bb45f20d541d17f92146d60746420db71d # pinned: patches rebased onto this upstream commit (10-28); re-pin only after re-simulating the chain

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Kotlin Native toolchain
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: |
            .github/patches
            .github/workflows

      - name: Hide Trakt card (Simkl-only build)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/hide-unconfigured-trakt.patch

      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if git apply fork-src/.github/patches/fork-updater.patch; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fork-updater.patch no longer applies to upstream; building without it"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply jellyfintv-updater patch
        if: steps.ver.outputs.should_build == 'true' && steps.patch_updater.outputs.applied == 'true'
        run: git apply fork-src/.github/patches/jellyfintv-updater.patch

      # The iOS IPA gets the same patch chain as the Android APK. The order and the patch lists are
      # read from this very workflow file (the "for P in" lines of the Android job), so a patch
      # added to the Android job reaches iOS too. ios-15-compat and ios-updater go in before the
      # optional ports; custom-stretch-ios (Swift half) follows custom-stretch; ios-platform-actuals
      # (iOS actuals for the fork features) goes last.
      - name: Apply feature, variant and port patches (same chain as Android)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          WF=fork-src/.github/workflows/android-jellyfin-livetv.yml
          lists() { awk -v m="$1" '$0 ~ m { sub(/.*for P in /,""); sub(/; *do.*/,""); sub(/;$/,""); print; exit }' "$WF"; }
          MAND=$(lists 'for P in livetv-feature')
          RESHAPED=$(lists 'for P in autosync-libmpv-compat')
          ENH=$(lists 'for P in enhanced-base')
          echo "mandatory: $MAND"; echo "reshaped: $RESHAPED"; echo "enhanced: $ENH"
          [ -n "$MAND" ] && [ -n "$RESHAPED" ] && [ -n "$ENH" ] || { echo "::error::could not read the patch lists from the workflow"; exit 1; }
          apply_required() {
            if ! git apply "fork-src/.github/patches/$1.patch"; then
              echo "::error::$1.patch no longer applies to upstream cmp-rewrite (iOS)"; exit 1
            fi
            echo "applied $1.patch"
          }
          apply_optional() {
            if git apply "fork-src/.github/patches/$1.patch"; then
              echo "applied $1.patch"; return 0
            fi
            echo "::warning::$1.patch no longer applies to upstream; building without it"; return 1
          }
          for P in $MAND; do apply_required "$P"; done
          apply_required ios-15-compat
          apply_required ios-updater
          STRETCH=false
          for P in $RESHAPED; do
            apply_optional "$P" && [ "$P" = custom-stretch ] && STRETCH=true
          done
          apply_required mobile-jellyfin-cinematic-ui
          for P in $ENH; do apply_optional "$P" || true; done
          if [ "$STRETCH" = true ]; then
            if ! git apply fork-src/.github/patches/custom-stretch-ios.patch; then
              echo "::error::custom-stretch-ios.patch no longer applies (custom-stretch is in; the Kotlin bridge needs the Swift half)"; exit 1
            fi
            echo "applied custom-stretch-ios.patch"
          fi
          apply_required ios-platform-actuals
          apply_required ios-xcode26-compat
          apply_required ios-runtime-features
          apply_required ios-player-extras
          apply_required ios-autosync
          apply_required ios-audio-subs
          git diff --stat | tail -1

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'MDBLIST_CLIENT_ID=37RRuqIIBQbBsHmxcdl3RGRMhrpTK8FdFxAGltS0' \
            'TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=full' \
            > local.properties

      # build-ios-ipa.sh derives this path (build/ios-derived-full-release) and builds
      # incrementally into it; it also holds the SPM checkouts (MPVKit/ffmpeg artifacts) and
      # module caches. Restore/save are SPLIT so the save step can run even when the build
      # fails — failed iterations are exactly the ones that must not pay a cold 70-min build
      # again. Rolling key: restore the newest entry via prefix, save under a fresh run_id
      # key. If a repeat IPA build fails after this, suspect a poisoned cache first — delete
      # the ios-dd-* entries in the Actions cache UI before deeper debugging.
      - name: Restore Xcode DerivedData
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/ios-derived-full-release
          key: ios-dd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ios-dd-${{ runner.os }}-

      # ForkBuild compares run numbers from versionName "<ver>-fork.<run>"; the K/N framework
      # build gets it via gradle.properties (xcodebuild's script phase runs gradle without -P).
      - name: Stamp fork build version
        if: steps.ver.outputs.should_build == 'true'
        run: echo "nuvio.app.versionName=${{ steps.ver.outputs.ver }}-fork.${{ github.run_number }}" >> gradle.properties

      - name: Prepare iOS dependencies
        if: steps.ver.outputs.should_build == 'true'
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA (Release)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          set -o pipefail
          ./scripts/build-ios-ipa.sh 2>&1 | tee build-log-ios.txt

      - name: Save Xcode DerivedData (also on build failure)
        if: always() && steps.ver.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ios-derived-full-release
          key: ios-dd-${{ runner.os }}-${{ github.run_id }}

      - name: Rename IPA
        if: steps.ver.outputs.should_build == 'true'
        run: |
          mkdir -p release-files
          IPA=$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-release.ipa" -print -quit)
          if [ -z "$IPA" ]; then
            echo "::error::no IPA produced"
            find build -name "*.ipa" 2>/dev/null || true
            exit 1
          fi
          cp "$IPA" "release-files/NuvioMobileJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.ipa"
          ls -l release-files

      - name: Upload artifacts
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobileJellyfinTV-ipa
          path: release-files/*.ipa
          if-no-files-found: error

      - name: Publish IPA to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-jellyfin-livetv-${{ steps.ver.outputs.tag }}
          name: NuvioMobile Jellyfin+LiveTV ${{ steps.ver.outputs.tag }}
          prerelease: true
          body: ${{ steps.ver.outputs.notes }}
          files: release-files/*.ipa

      - name: Remove legacy IPA assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioMobileJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.ipa
          TAG: mobile-jellyfin-livetv-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name | endswith(".ipa"))
                | select(.name != $keep)
                | select((((.name | capture("-b(?<n>[0-9]+)\\.ipa$") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy IPA asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram (IPA)
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: mobile-jellyfin-livetv-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          HASH=""
          for f in release-files/*.ipa; do
            [ -e "$f" ] || continue
            HASH="${HASH}$(basename "$f"): $(stat -c%s "$f") bytes, sha256 $(sha256sum "$f" | cut -c1-16)..."
          done
          MSG="📱 NuvioMobile Jellyfin+LiveTV ${VER} IPA is ready (build ${BUILD_NO})
          UNSIGNED iOS IPA (same as upstream's test builds) — sideload with AltStore/Sideloadly/esign; works on iPhone + iPad
          Installs as upstream Nuvio iOS identity; Live TV + Jellyfin nav entries are Android-only for now
          ${HASH}
          Download: https://github.com/vgupta1192/NuvioMobile/releases/tag/${REL_TAG}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure (iOS)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-jellyfin-livetv-debug-logs
          name: Mobile LiveTV CI debug logs
          prerelease: true
          files: build-log-ios.txt

